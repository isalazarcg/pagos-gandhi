<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gandhi - Pagos</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: sans-serif; background-color: #f4f4f4; }
        .header { background: #FFD700; padding: 15px; text-align: center; font-weight: bold; border-bottom: 2px solid #000; position: sticky; top: 0; z-index: 100; }
        .container { width: 100%; height: calc(100vh - 50px); overflow: hidden; }
        iframe { width: 100%; height: 100%; border: none; }
        .msg { padding: 20px; text-align: center; font-size: 14px; }
        .btn-link { display: inline-block; margin-top: 10px; padding: 10px 20px; background: #000; color: #fff; text-decoration: none; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="header">LECTOR DE PAGOS GANDHI</div>
    
    <div class="container">
        <iframe src="https://ldi.me/ldi/report/login/" id="portal"></iframe>
    </div>

    <div id="fallback" class="msg" style="display:none;">
        <p>Si no ves el formulario de acceso, toca el botón de abajo para abrir la versión optimizada:</p>
        <a href="https://ldi.me/ldi/report/login/" class="btn-link" target="_blank">ABRIR PORTAL DIRECTO</a>
    </div>

    <script>
        // Si después de 3 segundos el iframe no carga contenido visible (sigue en blanco)
        // mostramos un botón de acceso directo optimizado para el móvil.
        setTimeout(function() {
            var ifr = document.getElementById('portal');
            if (ifr.offsetWidth <= 0) {
                document.getElementById('fallback').style.display = 'block';
            }
        }, 3000);
    </script>
</body>
</html>
