<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gandhi - Pagos</title>
    <style>
        body { 
            margin: 0; 
            font-family: 'Helvetica', sans-serif; 
            background-color: #000; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            color: #FFD700;
        }
        .card {
            background: #FFD700;
            color: #000;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            width: 80%;
            max-width: 400px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        h1 { font-size: 24px; margin-bottom: 10px; }
        p { font-size: 16px; margin-bottom: 25px; font-weight: bold; }
        .btn {
            display: block;
            background: #000;
            color: #FFD700;
            text-decoration: none;
            padding: 20px;
            border-radius: 10px;
            font-size: 20px;
            font-weight: bold;
            text-transform: uppercase;
        }
        .footer { margin-top: 30px; font-style: italic; font-size: 12px; color: #666; }
    </style>
</head>
<body>

    <div class="card">
        <h1>LECTOR DE PAGOS</h1>
        <p>Toca el botón para verificar el cargo del cliente</p>
        
        <a href="http://ldi.me/ldi/report/login/" class="btn">ENTRAR AL PORTAL</a>
    </div>

    <div class="footer">
        "Si el camino es largo, acórtalo con un clic."
    </div>

</body>
</html>
